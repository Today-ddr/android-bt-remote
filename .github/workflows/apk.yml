name: Generate APK

env:
  main_project_module: app

on:
  push:
    branches:
      - "main"
      - "release/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，可带或不带 v 前缀，如 0.1.1 / v0.1.1"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set VERSION (push)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/*)
              version="${GITHUB_REF_NAME#v}"
              ;;
            refs/heads/release/*)
              version="${GITHUB_REF_NAME#release/}"
              version="${version#v}"
              ;;
            refs/heads/main)
              version="dev-${GITHUB_SHA:0:7}"
              ;;
            *)
              echo "::error::unsupported ref: ${GITHUB_REF}"
              exit 1
              ;;
          esac
          if [ -z "${version}" ]; then
            echo "::error::cannot derive version from ${GITHUB_REF}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_ENV}"

      - name: Set VERSION (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(printf '%s' "${INPUT_VERSION}" | tr -d '[:space:]')"
          version="${version#v}"
          version="${version#V}"
          if [ -z "${version}" ]; then
            echo "::error::version input must not be empty"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_ENV}"

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Patch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          chmod +x ./build.sh ./src/gradlew
          ./build.sh

      - name: Build installable debug APK
        run: |
          cd src
          ./gradlew assembleDefaultDebug --stacktrace

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-remote-${{ env.version }}-debug
          path: src/${{ env.main_project_module }}/build/outputs/apk/default/debug/app-default-debug.apk
          if-no-files-found: error

      - name: Publish (GitHub)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          files: |
            src/${{ env.main_project_module }}/build/outputs/apk/default/debug/app-default-debug.apk
